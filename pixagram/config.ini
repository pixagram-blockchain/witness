# ============================================================================
# Pixagram witness node - consensus only.
#
# Validates blocks, produces blocks in your scheduled slot, and nothing else.
# No HAF, no PostgreSQL, no Hivemind, no public API.
#
# Required edits before starting:
#   1. witness     = "<your_witness_account>"
#   2. private-key = <your witness SIGNING key, WIF>
# ============================================================================

backtrace = yes

# ----------------------------------------------------------------------------
# Plugins
# ----------------------------------------------------------------------------
# The smallest set that produces blocks AND lets the price feed broadcast from
# this machine rather than through somebody else's node:
#
#   witness                block production
#   database_api           the feed reads the chain id from get_config
#   condenser_api          the feed reads global properties before signing
#   network_broadcast_api  the feed submits its signed feed_publish here
#
# chain, p2p, webserver and json_rpc arrive as transitive dependencies.
#
# This set was not guessed. The full stack was run against
# pixadock/pixagram:mainnet until the feed got all the way to submitting a
# transaction: drop condenser_api and it dies with
#     get props: Could not find API condenser_api
# drop database_api and it cannot resolve the chain id.
#
# Everything else is left out on purpose. account_history_rocksdb alone
# measured 1.2 GB of a 1.57 GB datadir - 76% of the disk - plus a large rocksdb
# cache in RAM, and a witness answers no history queries. market_history,
# reputation, transaction_status and metadata are API-node surface too.
plugin = witness database_api condenser_api network_broadcast_api

# ----------------------------------------------------------------------------
# Chainbase state file
# ----------------------------------------------------------------------------
# The file is sparse: it reserves address space, not disk. 1G is years of
# headroom for a consensus-only node.
shared-file-size = 1G

# ----------------------------------------------------------------------------
# Local API - reachable from the price-feed container, nowhere else
# ----------------------------------------------------------------------------
# Bound to 0.0.0.0 *inside the container* so the feed can reach it over the
# compose network by service name. docker-compose.yml deliberately does NOT
# publish this port - not even on 127.0.0.1 - so it is invisible from the host
# and from the internet. Keep it that way: a witness serving a public API
# attracts load that makes it miss blocks.
webserver-http-endpoint = 0.0.0.0:7777
webserver-thread-pool-size = 2

# ----------------------------------------------------------------------------
# P2P
# ----------------------------------------------------------------------------
# Port 2001 must be reachable from the internet, or you will not sync and you
# will not see other witnesses' blocks.
p2p-endpoint = 0.0.0.0:2001
p2p-seed-node = api.pixagram.com:2001

# ----------------------------------------------------------------------------
# Logging
# ----------------------------------------------------------------------------
log-appender = {"appender":"stderr","stream":"std_error","time_format":"iso_8601_microseconds"}
log-logger   = {"name":"default","level":"info","appender":"stderr"}

# ============================================================================
# Witness identity - EDIT THESE
# ============================================================================

# The account this node produces for. It must already be registered on chain
# with witness_update_operation before it will ever be scheduled.
#
# Both lines below are commented out on purpose. hived's witness plugin parses
# private-key at startup and aborts with
#     assert_exception: private_key.valid() / unable to parse private key
# if the option is present but empty, so a freshly cloned repo would crash-loop
# instead of starting. Uncomment both once you have your values.
#witness = "your_witness_account"

# The witness SIGNING key in WIF form (starts with 5...). This is the key you
# registered with witness_update - NOT your owner key and NOT your active key.
#
# chmod 600 this file. .gitignore already excludes .env, but this file is
# tracked, so never commit it once you have filled the key in.
#
# Because it is tracked, a later `git pull` or `git reset --hard` will also
# overwrite your filled-in copy with this placeholder. hived reads this file
# only at startup, so the running node keeps producing and you see nothing
# wrong - until the next restart, when it silently stops producing. After you
# fill in your key, run:
#
#     git update-index --skip-worktree pixagram/config.ini
#
#private-key = 5xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

# ============================================================================
# Two settings you must NOT copy from the genesis bootstrap node
# ============================================================================
#
#   enable-stale-production = true
#   required-participation  = 0
#
# The node that starts the chain carries both, because it has to produce
# blocks alone with no peers. On a node joining an existing network they
# remove exactly the protections you want: the first makes you build on a
# chain you already know is stale, the second drops the check that stops you
# producing during a network split. Leaving both unset - as they are here -
# means your node refuses to produce when it cannot see a healthy network.
