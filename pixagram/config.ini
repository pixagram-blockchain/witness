# ============================================================================
# Pixagram witness node — minimal config.
#
# Only produces blocks when scheduled, follows the live chain via p2p.
# No RPC, no APIs, no history, no HAF, no Hivemind. Just hived.
#
# Required edits before starting:
#   1. Set `witness = "<your_witness_account>"` below
#   2. Set `private-key = <your_witness_signing_key_WIF>` below
# ============================================================================

backtrace = yes

# Only the witness plugin. Hived pulls in chain + p2p as transitive deps.
plugin = witness

# Smaller shared memory — witness state is tiny vs an API node
shared-file-size = 1G

# P2P: listen on 0.0.0.0:2001, seed from the public pre-mainnet node
p2p-endpoint = 0.0.0.0:2001
p2p-seed-node = api.pixagram.com:2001

# Logging
log-appender = {"appender":"stderr","stream":"std_error","time_format":"iso_8601_microseconds"}
log-logger   = {"name":"default","level":"info","appender":"stderr"}

# ============================================================================
# Witness identity — EDIT THESE
# ============================================================================

# The witness account name this node produces for (must be registered on chain
# via witness_update_operation before this node will be scheduled).
witness = ""

# The signing key for the witness account (WIF format, starts with 5...).
# Keep this file out of git — add `pixagram/config.ini` to .gitignore or use
# a template + symlink pattern.
private-key =
