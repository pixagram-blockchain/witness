# ============================================================================
# Pixagram witness node - consensus only.
#
# Validates blocks, produces blocks in your scheduled slot, and nothing else.
# No HAF, no PostgreSQL, no Hivemind, no public API.
#
# Required edits before starting:
#   1. witness     = "<your_witness_account>"
#   2. private-key = <your witness SIGNING key, WIF>
# ============================================================================

backtrace = yes

# ----------------------------------------------------------------------------
# Plugins
# ----------------------------------------------------------------------------
# The witness plugin alone. hived pulls in chain, p2p, webserver and json_rpc
# as transitive dependencies, so a webserver does start and listen - but with
# no API plugins registered it answers every method with
# "Could not find API <name>". That is intended: this node produces blocks and
# exposes nothing. Query the chain against https://api.pixagram.com instead.
#
# Verified by booting a node with this config against pixadock/pixagram:mainnet.
plugin = witness

# DELIBERATELY NOT ENABLED - this is where an API node spends its resources:
#   account_history_rocksdb + account_history_api
#       measured 1.2 GB of a 1.57 GB datadir, i.e. 76% of the disk, plus a
#       large rocksdb block cache in RAM. A witness answers no history
#       queries, so it is pure overhead.
#   market_history(+_api), reputation(+_api), transaction_status(+_api)
#       API-node surface, irrelevant to consensus.
#   metadata
#       stores account json_metadata (profile names, avatars) from 1.28.7 on.
#       Needed by Hivemind and API nodes, not by a block producer.

# ----------------------------------------------------------------------------
# Chainbase state file
# ----------------------------------------------------------------------------
# The file is sparse: it reserves address space, not disk. 1G is years of
# headroom for a consensus-only node.
shared-file-size = 1G

# ----------------------------------------------------------------------------
# P2P
# ----------------------------------------------------------------------------
# Port 2001 must be reachable from the internet, or you will not sync and you
# will not see other witnesses' blocks.
p2p-endpoint = 0.0.0.0:2001
p2p-seed-node = api.pixagram.com:2001

# ----------------------------------------------------------------------------
# Logging
# ----------------------------------------------------------------------------
log-appender = {"appender":"stderr","stream":"std_error","time_format":"iso_8601_microseconds"}
log-logger   = {"name":"default","level":"info","appender":"stderr"}

# ============================================================================
# Witness identity - EDIT THESE
# ============================================================================

# The account this node produces for. It must already be registered on chain
# with witness_update_operation before it will ever be scheduled.
witness = ""

# The witness SIGNING key in WIF form (starts with 5...). This is the key you
# registered with witness_update - NOT your owner key and NOT your active key.
#
# chmod 600 this file. .gitignore already excludes .env, but this file is
# tracked, so never commit it once you have filled the key in.
private-key =

# ============================================================================
# Two settings you must NOT copy from the genesis bootstrap node
# ============================================================================
#
#   enable-stale-production = true
#   required-participation  = 0
#
# The node that starts the chain carries both, because it has to produce
# blocks alone with no peers. On a node joining an existing network they
# remove exactly the protections you want: the first makes you build on a
# chain you already know is stale, the second drops the check that stops you
# producing during a network split. Leaving both unset - as they are here -
# means your node refuses to produce when it cannot see a healthy network.
